name: CD - Promote

on:
  workflow_dispatch:
    inputs:
      process_name:
        description: "Process name (as shown in Boomi / by 'List Boomi Processes')"
        required: true
        type: string
      target_environment:
        description: "Environment to promote into"
        required: true
        type: choice
        options:
          - qa
          - prod
      version:
        description: "Optional — promote this specific version (e.g. v1.0) instead of whatever's currently deployed in the environment below. Must have actually been deployed there at some point (checked against the ledger)."
        required: false
        type: string
      comment:
        description: "Optional note about this promotion (shown in the tracking issue)"
        required: false
        type: string
      # No package_id here on purpose: a promotion always resolves from the
      # environment one below (current, or a specific --version of it — see
      # "Resolve" step below), never an arbitrary package. A process that
      # was never deployed to Dev cannot be promoted straight to QA. The
      # only place an explicit, older package_id is accepted is the
      # workflow_call interface below, used exclusively by rollback.yml.

  # Lets rollback.yml redeploy an older package through this same workflow,
  # so a rollback gets the identical tracking-issue / approval-gate /
  # deployment-record behavior as a normal promotion — no separate,
  # weaker path for undoing a mistake.
  workflow_call:
    inputs:
      process_name:
        required: true
        type: string
      package_id:
        required: false
        type: string
      target_environment:
        required: true
        type: string
      comment:
        required: false
        type: string

concurrency:
  # One promotion (or rollback) at a time per process+environment, so two
  # dispatches can't deploy to the same target concurrently.
  group: cd-${{ inputs.process_name }}-${{ inputs.target_environment }}
  cancel-in-progress: false

permissions:
  contents: write # the "deploy" job commits the deployment-ledger update
  issues: write
  deployments: write

jobs:
  # Resolves the package to deploy and opens the tracking issue *before*
  # the "deploy" job's environment gate — so a required reviewer approving
  # a prod promotion sees this issue already linked to the run (who, what,
  # why), not just the raw workflow inputs GitHub shows natively.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      package-id: ${{ steps.resolve.outputs.package-id }}
      component-id: ${{ steps.resolve.outputs.component-id }}
      version: ${{ steps.resolve.outputs.version }}
      issue-number: ${{ steps.create_issue.outputs.issue-number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Promoting always means "take whatever's currently deployed in the
      # environment below this one" (Dev -> QA, QA -> PD), read from this
      # repo's own deployment ledger — never an arbitrary package that was
      # built but never actually deployed there. This is enforced
      # structurally, not just a default: workflow_dispatch (the human
      # form above) has no package_id input at all, so `inputs.package_id`
      # is only ever non-empty when this workflow is invoked via
      # workflow_call — i.e. by rollback.yml, the one deliberate exception.
      # resolve_current_package.py has no Boomi-API fallback: if this
      # process was never actually deployed to the environment below, the
      # run fails here rather than guessing. See deployments/README.md.
      - name: Resolve package_id if needed
        id: resolve
        working-directory: scripts
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
        run: |
          if [ -n "${{ inputs.package_id }}" ]; then
            echo "package-id=${{ inputs.package_id }}" >> "$GITHUB_OUTPUT"
          else
            source_env="dev"
            if [ "${{ inputs.target_environment }}" = "prod" ]; then source_env="qa"; fi
            python resolve_current_package.py --name "${{ inputs.process_name }}" --environment "$source_env" --version "${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      # Best-effort, display-only lookup of what's currently in the
      # *target* environment (before this promotion) so the issue/job
      # summary show a before -> after diff for whoever approves the
      # "deploy" job's environment gate.
      - name: Describe current target-environment state
        id: current
        working-directory: scripts
        run: python describe_current.py --name "${{ inputs.process_name }}" --environment "${{ inputs.target_environment }}" >> "$GITHUB_OUTPUT"

      # Structural diff (elements/attributes changed, in plain terms, not
      # raw XML) on top of the version/package-id diff above — see
      # diff_component_versions.py. Non-fatal: degrades to
      # xml-diff-available=false rather than blocking the promotion if it
      # can't produce one for some reason.
      - name: Diff process structure
        id: xmldiff
        continue-on-error: true
        working-directory: scripts
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
        run: |
          python diff_component_versions.py \
            --component-id "${{ steps.resolve.outputs.component-id }}" \
            --from-package-id "${{ steps.current.outputs.current-package-id }}" \
            --to-package-id "${{ steps.resolve.outputs.package-id }}" \
            --out ../component_diff.txt >> "$GITHUB_OUTPUT"

      - name: Upload process diff
        if: steps.xmldiff.outputs.xml-diff-available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: process-diff
          path: component_diff.txt

      - name: Create tracking issue
        id: create_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          diff_line="${{ inputs.target_environment }}: ${{ steps.current.outputs.current }} -> ${{ steps.resolve.outputs.version }} (package ${{ steps.resolve.outputs.package-id }})"
          if [ "${{ steps.xmldiff.outputs.xml-diff-available }}" = "true" ]; then
            xml_diff_note="See this run's job summary and the process-diff artifact."
          else
            xml_diff_note="Not available for this run (see job summary/logs for why)."
          fi
          issue_title="Promote ${{ inputs.process_name }} to ${{ inputs.target_environment }}"
          issue_body=$(cat <<EOF
          {
          "process_name": "${{ inputs.process_name }}",
          "package_id": "${{ steps.resolve.outputs.package-id }}",
          "version": "${{ steps.resolve.outputs.version }}",
          "target_environment": "${{ inputs.target_environment }}",
          "diff": "$diff_line",
          "process_diff": "$xml_diff_note",
          "requested_by": "${{ github.actor }}",
          "comment": "${{ inputs.comment }}",
          "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          )
          response=$(curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$(jq -n --arg title "$issue_title" --arg body "$issue_body" --arg env "${{ inputs.target_environment }}" '{title: $title, body: $body, labels: ["promote", $env]}')" \
            "https://api.github.com/repos/${{ github.repository }}/issues")
          issue_number=$(echo "$response" | jq -r '.number')
          echo "issue-number=$issue_number" >> "$GITHUB_OUTPUT"

          echo "## Promote ${{ inputs.process_name }} to ${{ inputs.target_environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$diff_line" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tracking issue: #$issue_number" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    # The "prod" choice maps to the GitHub Environment named "production" so
    # that Environment's required reviewers (if configured) gate this job.
    # The "prepare" job above already opened the tracking issue, so a
    # reviewer approving here sees it linked rather than approving blind.
    environment: ${{ inputs.target_environment == 'prod' && 'production' || inputs.target_environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create deployment record
        id: create_deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          env_name="${{ inputs.target_environment == 'prod' && 'production' || inputs.target_environment }}"
          response=$(curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$(jq -n --arg ref "${{ github.sha }}" --arg env "$env_name" \
                  --arg desc "Promote ${{ inputs.process_name }} (package ${{ needs.prepare.outputs.package-id }})" \
                  '{ref: $ref, environment: $env, auto_merge: false, required_contexts: [], description: $desc}')" \
            "https://api.github.com/repos/${{ github.repository }}/deployments")
          deployment_id=$(echo "$response" | jq -r '.id')
          echo "deployment-id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Deploy package to target environment
        id: deploy
        working-directory: scripts
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
        run: |
          python deploy_component.py \
            --package-id "${{ needs.prepare.outputs.package-id }}" \
            --env "${{ inputs.target_environment == 'prod' && 'prod' || inputs.target_environment }}" \
            --config "../environments/${{ inputs.target_environment == 'prod' && 'prod' || inputs.target_environment }}.json"

      # Records this promotion into deployments/{ledger,current}.csv and
      # pushes it back to the repo with the run's own GITHUB_TOKEN — GitHub
      # doesn't re-trigger push-triggered workflows for GITHUB_TOKEN
      # commits, so this can't loop (not that cd.yml is push-triggered
      # anyway). See deployments/README.md.
      - name: Record deployment in ledger
        if: steps.deploy.outcome == 'success'
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
        run: |
          env_name="${{ inputs.target_environment == 'prod' && 'prod' || inputs.target_environment }}"
          python scripts/update_deployment_ledger.py \
            --process-name "${{ inputs.process_name }}" \
            --component-id "${{ needs.prepare.outputs.component-id }}" \
            --environment "$env_name" \
            --package-id "${{ needs.prepare.outputs.package-id }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --action promote --status success \
            --requested-by "${{ github.actor }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --comment "${{ inputs.comment }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployments/
          if git diff --cached --quiet; then
            echo "No ledger changes to commit."
          else
            git commit -m "Record promotion: ${{ inputs.process_name }} -> $env_name (${{ needs.prepare.outputs.package-id }})"
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin "${{ github.ref_name }}"
              if git rebase "origin/${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then
                pushed=true
                break
              fi
              sleep $((attempt * 3))
            done
            if [ "$pushed" != true ]; then
              echo "::warning::Failed to push deployment-ledger update after 3 attempts — deployments/*.csv is now out of date until this is reconciled manually."
            fi
          fi

      - name: Finalize deployment status and tracking issue
        if: always() && needs.prepare.outputs.issue-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          outcome="${{ job.status }}"
          state="success"
          if [ "$outcome" != "success" ]; then state="failure"; fi

          if [ -n "${{ steps.create_deployment.outputs.deployment-id }}" ]; then
            curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d "$(jq -n --arg state "$state" '{state: $state, description: ("Run finished with status: " + $state)}')" \
              "https://api.github.com/repos/${{ github.repository }}/deployments/${{ steps.create_deployment.outputs.deployment-id }}/statuses"
          fi

          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$(jq -n --arg body "Run finished with status: $outcome." '{body: $body}')" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ needs.prepare.outputs.issue-number }}/comments"
          curl -s -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"state": "closed"}' \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ needs.prepare.outputs.issue-number }}"
