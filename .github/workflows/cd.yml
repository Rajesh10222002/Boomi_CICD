name: CD - Promote

on:
  workflow_dispatch:
    inputs:
      process_name:
        description: "Process name, as it appears in components/components.json"
        required: true
      package_id:
        description: "Boomi packaged component id to deploy (from CI, or from the app)"
        required: true
      target_environment:
        description: "Environment to promote into"
        required: true
        type: choice
        options:
          - qa
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The "prod" choice maps to the GitHub Environment named "production" so
    # that Environment's required reviewers (if configured) gate this job.
    environment: ${{ github.event.inputs.target_environment == 'prod' && 'production' || github.event.inputs.target_environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Deploy package to target environment
        working-directory: scripts
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
        run: |
          python deploy_component.py \
            --package-id "${{ github.event.inputs.package_id }}" \
            --env "${{ github.event.inputs.target_environment }}" \
            --config "../environments/${{ github.event.inputs.target_environment == 'prod' && 'prod' || github.event.inputs.target_environment }}.json"
