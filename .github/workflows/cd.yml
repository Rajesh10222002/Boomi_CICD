name: CD - Promote

on:
  workflow_dispatch:
    inputs:
      process_name:
        description: "Process name (as shown in Boomi / by 'List Boomi Processes')"
        required: true
      package_id:
        description: "Boomi packaged component id to deploy — optional, resolves to process_name's latest package if left blank. For a rollback, use 'List Boomi Packages' to find an older one."
        required: false
      target_environment:
        description: "Environment to promote into"
        required: true
        type: choice
        options:
          - qa
          - prod
      comment:
        description: "Optional note about this promotion (shown in the tracking issue)"
        required: false

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The "prod" choice maps to the GitHub Environment named "production" so
    # that Environment's required reviewers (if configured) gate this job.
    environment: ${{ github.event.inputs.target_environment == 'prod' && 'production' || github.event.inputs.target_environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve package_id if needed
        id: resolve
        working-directory: scripts
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
        run: |
          if [ -n "${{ github.event.inputs.package_id }}" ]; then
            echo "package-id=${{ github.event.inputs.package_id }}" >> "$GITHUB_OUTPUT"
          else
            python resolve_latest_package.py --name "${{ github.event.inputs.process_name }}" >> "$GITHUB_OUTPUT"
          fi

      # Runs after the step above so the issue shows the resolved
      # package_id even when it wasn't given explicitly.
      - name: Create tracking issue
        id: create_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          issue_title="Promote ${{ github.event.inputs.process_name }} to ${{ github.event.inputs.target_environment }}"
          issue_body=$(cat <<EOF
          {
          "process_name": "${{ github.event.inputs.process_name }}",
          "package_id": "${{ steps.resolve.outputs.package-id }}",
          "target_environment": "${{ github.event.inputs.target_environment }}",
          "requested_by": "${{ github.actor }}",
          "comment": "${{ github.event.inputs.comment }}",
          "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          )
          response=$(curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$(jq -n --arg title "$issue_title" --arg body "$issue_body" --arg env "${{ github.event.inputs.target_environment }}" '{title: $title, body: $body, labels: ["promote", $env]}')" \
            "https://api.github.com/repos/${{ github.repository }}/issues")
          issue_number=$(echo "$response" | jq -r '.number')
          echo "issue-number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Deploy package to target environment
        working-directory: scripts
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
        run: |
          python deploy_component.py \
            --package-id "${{ steps.resolve.outputs.package-id }}" \
            --env "${{ github.event.inputs.target_environment }}" \
            --config "../environments/${{ github.event.inputs.target_environment == 'prod' && 'prod' || github.event.inputs.target_environment }}.json"

      - name: Close tracking issue
        if: always() && steps.create_issue.outputs.issue-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          outcome="${{ job.status }}"
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$(jq -n --arg body "Run finished with status: $outcome." '{body: $body}')" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.create_issue.outputs.issue-number }}/comments"
          curl -s -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"state": "closed"}' \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.create_issue.outputs.issue-number }}"
