name: CD - Promote

on:
  workflow_dispatch:
    inputs:
      process_name:
        description: "Process name (as shown in Boomi / by 'List Boomi Processes')"
        required: true
        type: string
      extensions_mode:
        description: "Environment extensions (only when the repo variable EXT_SYNC=true): dry-run shows what would be set; apply sets them"
        required: false
        type: choice
        default: dry-run
        options:
          - dry-run
          - apply

concurrency:
  # Keep each process's Dev -> production promotion serialized.
  group: cd-${{ inputs.process_name }}
  cancel-in-progress: false

permissions:
  contents: write # the deploy job commits the deployment-ledger update
  issues: write
  deployments: write

jobs:
  # Dev -> Production (no QA stage). Resolves the package currently deployed in Dev, runs the
  # checklist and diff, and opens the tracking issue BEFORE the production environment gate.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      package-id: ${{ steps.resolve.outputs.package-id }}
      component-id: ${{ steps.resolve.outputs.component-id }}
      version: ${{ steps.resolve.outputs.version }}
      issue-number: ${{ steps.create_issue.outputs.issue-number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Resolve the package currently deployed in Dev from this repo's
      # ledger (falls back to Boomi's active Dev deployment); never Boomi's
      # global latest-package lookup.
      - name: Resolve current Dev package
        id: resolve
        working-directory: scripts
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
        run: python resolve_current_package.py --name "${{ inputs.process_name }}" --environment dev >> "$GITHUB_OUTPUT"

      # Best-effort, display-only lookup of what's currently in production.
      - name: Describe current production state
        id: current
        working-directory: scripts
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
        run: python describe_current.py --name "${{ inputs.process_name }}" --environment prod >> "$GITHUB_OUTPUT"

      - name: Summary - promotion request
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          # 🚀 Promote `${{ inputs.process_name }}` from Dev to Production

          | | |
          |---|---|
          | **Process** | ${{ inputs.process_name }} |
          | **Version to deploy** | ${{ steps.resolve.outputs.version }} |
          | **Package** | `${{ steps.resolve.outputs.package-id }}` |
          | **Currently in Production** | ${{ steps.current.outputs.current }} |
          | **Requested by** | @${{ github.actor }} |
          | **Run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

          ---

          EOF

      # Checklist validation (checklist.md) against the package's component
      # XML. Never fails the run: results (pass / fail / needs-review) go in
      # the job summary and tracking issue so the reviewer decides.
      - name: Validate checklist
        id: checklist
        continue-on-error: true
        working-directory: scripts
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
        run: |
          python validate_checklist.py \
            --process-name "${{ inputs.process_name }}" \
            --component-id "${{ steps.resolve.outputs.component-id }}" \
            --package-id "${{ steps.resolve.outputs.package-id }}" \
            --source-environment dev \
            --out ../checklist_report.md >> "$GITHUB_OUTPUT"

      - name: Upload checklist report
        if: steps.checklist.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: checklist-report
          path: checklist_report.md

      # First thing in the job summary, so the approver sees the checklist
      # result before anything else on the run page.
      - name: Show checklist in job summary
        run: |
          if [ "${{ steps.checklist.outcome }}" = "success" ]; then
            cat checklist_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "> ⚠️ Checklist validation did not run — review manually." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Structural diff (elements/attributes changed, in plain terms, not
      # raw XML). Non-fatal: degrades to xml-diff-available=false rather
      # than blocking the promotion.
      - name: Diff process structure
        id: xmldiff
        continue-on-error: true
        working-directory: scripts
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
        run: |
          python diff_component_versions.py \
            --component-id "${{ steps.resolve.outputs.component-id }}" \
            --from-package-id "${{ steps.current.outputs.current-package-id }}" \
            --to-package-id "${{ steps.resolve.outputs.package-id }}" \
            --out ../component_diff.txt >> "$GITHUB_OUTPUT"

      - name: Upload process diff
        if: steps.xmldiff.outputs.xml-diff-available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: process-diff
          path: component_diff.txt

      - name: Create tracking issue
        id: create_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          diff_line="prod: ${{ steps.current.outputs.current }} -> ${{ steps.resolve.outputs.version }} (package ${{ steps.resolve.outputs.package-id }})"
          if [ "${{ steps.xmldiff.outputs.xml-diff-available }}" = "true" ]; then
            xml_diff_note="See this run's job summary and the process-diff artifact."
          else
            xml_diff_note="Not available for this run (see job summary/logs for why)."
          fi
          if [ "${{ steps.checklist.outcome }}" = "success" ]; then
            checklist_md=$(cat checklist_report.md)
          else
            checklist_md="Checklist validation did not run (see the run logs) — review manually."
          fi
          issue_title="Promote ${{ inputs.process_name }} to production"
          issue_body=$(cat <<EOF
          Process: ${{ inputs.process_name }}
          Package: ${{ steps.resolve.outputs.package-id }}
          Version: ${{ steps.resolve.outputs.version }}
          Source: dev
          Target: prod
          Deployment: $diff_line
          Process diff: $xml_diff_note

          Requested by: ${{ github.actor }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          $checklist_md

          **Reviewer:** check the failed / needs-review items above, then approve or reject the production deployment in the run's "Review deployments" prompt.
          EOF
          )
          response=$(curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$(jq -n --arg title "$issue_title" --arg body "$issue_body" '{title: $title, body: $body, labels: ["promote", "prod"]}')" \
            "https://api.github.com/repos/${{ github.repository }}/issues")
          issue_number=$(echo "$response" | jq -r '.number')

          if [ -z "$issue_number" ] || [ "$issue_number" = "null" ]; then
            issue_number=""
            echo "::warning::Could not create the tracking issue: $response"
          fi
          echo "issue-number=$issue_number" >> "$GITHUB_OUTPUT"

          {
            echo ""
            echo "---"
            echo ""
            echo "📌 **Tracking issue:** #$issue_number — closes automatically when this run finishes."
            echo ""
            echo "_Approve or reject the production deployment with **Review deployments** at the top of this page._"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---- Environment extensions (optional; on only when repo variable EXT_SYNC == 'true') ----
  # Runs on the runner(s) in repo variable EXT_RUNNER_LABELS (e.g. a self-hosted runner that can
  # reach the extension value store). Plan = before approval: reads store METADATA only and the
  # field list from Dev; STOPS the run when a secret is missing for PD.
  extension-plan-pd:
    needs: prepare
    if: ${{ vars.EXT_SYNC == 'true' }}
    runs-on: ${{ fromJSON(vars.EXT_RUNNER_LABELS || '["self-hosted"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Plan PD extensions
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
          EXT_DB_DSN: ${{ secrets.EXT_DB_DSN }}
          EXT_PLAN_DB_USER: ${{ secrets.EXT_PLAN_DB_USER }}
          EXT_PLAN_DB_PASSWORD: ${{ secrets.EXT_PLAN_DB_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue-number }}
          PROCESS_NAME: ${{ inputs.process_name }}
          ENVIRONMENT: prod
          EXT_MODE: plan
        run: python scripts/apply_extensions.py

  deploy-production:
    needs: [prepare, extension-plan-pd]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.prepare.result == 'success' && (needs.extension-plan-pd.result == 'success' || needs.extension-plan-pd.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Sync latest deployment ledger
        run: |
          git fetch origin "${{ github.ref_name }}"
          git show "origin/${{ github.ref_name }}:deployments/ledger.csv" > deployments/ledger.csv
          git show "origin/${{ github.ref_name }}:deployments/current.csv" > deployments/current.csv

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create production deployment record
        id: create_deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          response=$(curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$(jq -n --arg ref "${{ github.sha }}" \
                  --arg desc "Promote ${{ inputs.process_name }} (package ${{ needs.prepare.outputs.package-id }})" \
                  '{ref: $ref, environment: "production", auto_merge: false, required_contexts: [], description: $desc}')" \
            "https://api.github.com/repos/${{ github.repository }}/deployments")
          deployment_id=$(echo "$response" | jq -r '.id')
          echo "deployment-id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Deploy the Dev package to production
        id: deploy
        working-directory: scripts
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
        run: |
          python deploy_component.py \
            --package-id "${{ needs.prepare.outputs.package-id }}" \
            --env prod \
            --config "../environments/prod.json"

      - name: Record production deployment in ledger
        if: steps.deploy.outcome == 'success'
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
        run: |
          python scripts/update_deployment_ledger.py \
            --process-name "${{ inputs.process_name }}" \
            --component-id "${{ needs.prepare.outputs.component-id }}" \
            --environment prod \
            --package-id "${{ needs.prepare.outputs.package-id }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --action promote --status success \
            --requested-by "${{ github.actor }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployments/
          if git diff --cached --quiet; then
            echo "No ledger changes to commit."
          else
            git commit -m "Record production promotion: ${{ inputs.process_name }} (${{ needs.prepare.outputs.package-id }})"
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin "${{ github.ref_name }}"
              if git rebase "origin/${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then
                pushed=true
                break
              fi
              sleep $((attempt * 3))
            done
            if [ "$pushed" != true ]; then
              echo "::warning::Failed to push deployment-ledger update after 3 attempts — deployments/*.csv is now out of date until this is reconciled manually."
            fi
          fi

      - name: Finalize production deployment and tracking issue
        if: always() && needs.prepare.outputs.issue-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          outcome="${{ job.status }}"
          state="success"
          if [ "$outcome" != "success" ]; then state="failure"; fi

          if [ -n "${{ steps.create_deployment.outputs.deployment-id }}" ]; then
            curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d "$(jq -n --arg state "$state" '{state: $state, description: ("Run finished with status: " + $state)}')" \
              "https://api.github.com/repos/${{ github.repository }}/deployments/${{ steps.create_deployment.outputs.deployment-id }}/statuses"
          fi

          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$(jq -n --arg body "Run finished with status: $outcome." '{body: $body}')" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ needs.prepare.outputs.issue-number }}/comments"
          curl -s -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"state": "closed"}' \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ needs.prepare.outputs.issue-number }}"

  # After the production deploy: set PD's connection extensions from the store
  # (dry-run unless extensions_mode=apply).
  apply-extensions-pd:
    needs: [prepare, deploy-production]
    if: ${{ vars.EXT_SYNC == 'true' && needs.deploy-production.result == 'success' }}
    runs-on: ${{ fromJSON(vars.EXT_RUNNER_LABELS || '["self-hosted"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply PD extensions
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
          EXT_DB_DSN: ${{ secrets.EXT_DB_DSN }}
          EXT_DB_USER: ${{ secrets.EXT_PD_DB_USER }}
          EXT_DB_PASSWORD: ${{ secrets.EXT_PD_DB_PASSWORD }}
          SECRETS_KEY: ${{ secrets.SECRETS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue-number }}
          PROCESS_NAME: ${{ inputs.process_name }}
          ENVIRONMENT: prod
          EXT_MODE: ${{ inputs.extensions_mode == 'apply' && 'apply' || 'dry-run' }}
        run: python scripts/apply_extensions.py

  # Safety net: closes any tracking issue still open once the run is over —
  # including when a reviewer rejects the gate (the gated job never starts, so
  # its own "finalize" step never runs) or the run is cancelled.
  close-issues:
    needs: [prepare, deploy-production, apply-extensions-pd]
    if: always() && needs.prepare.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Close any open tracking issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROD_ISSUE: ${{ needs.prepare.outputs.issue-number }}
          PROD_RESULT: ${{ needs.deploy-production.result }}
        run: |
          describe() {
            case "$1" in
              success)   echo "completed successfully" ;;
              failure)   echo "failed, or was rejected at the approval gate" ;;
              cancelled) echo "was cancelled" ;;
              skipped)   echo "was skipped" ;;
              *)         echo "ended with status: $1" ;;
            esac
          }
          close_if_open() {
            number="$1"; label="$2"; result="$3"
            [ -z "$number" ] && return 0
            state=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/issues/$number" | jq -r '.state')
            [ "$state" = "open" ] || return 0
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -d "$(jq -n --arg b "The $label deployment $(describe "$result"). Closing this tracking issue automatically." '{body: $b}')" "https://api.github.com/repos/${{ github.repository }}/issues/$number/comments" > /dev/null
            curl -s -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -d '{"state": "closed"}' "https://api.github.com/repos/${{ github.repository }}/issues/$number" > /dev/null
          }
          close_if_open "$PROD_ISSUE" "production" "$PROD_RESULT"
