name: CD - Promote

on:
  workflow_dispatch:
    inputs:
      process_name:
        description: "Process name (as shown in Boomi / by 'List Boomi Processes')"
        required: true
        type: string
      # No package_id here on purpose: the manual path resolves the package
      # from Dev and runs QA -> production in sequence. The workflow_call
      # interface below remains for rollback.yml.

  # Lets rollback.yml redeploy an older package through this same workflow,
  # so a rollback gets the identical tracking-issue / approval-gate /
  # deployment-record behavior as a normal promotion — no separate,
  # weaker path for undoing a mistake.
  workflow_call:
    inputs:
      process_name:
        required: true
        type: string
      package_id:
        required: false
        type: string
      target_environment:
        required: true
        type: string
      comment:
        required: false
        type: string

concurrency:
  # Keep each process's full QA -> production chain serialized.
  group: cd-${{ inputs.process_name }}
  cancel-in-progress: false

permissions:
  contents: write # the "deploy" job commits the deployment-ledger update
  issues: write
  deployments: write

jobs:
  # Resolves the package and opens the QA tracking issue before the QA
  # Environment gate. The production issue is opened after QA succeeds and
  # before the production gate.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      package-id: ${{ steps.resolve.outputs.package-id }}
      component-id: ${{ steps.resolve.outputs.component-id }}
      version: ${{ steps.resolve.outputs.version }}
      issue-number: ${{ steps.create_issue.outputs.issue-number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The manual path always takes the package currently deployed in Dev,
      # read from this repo's own deployment ledger — never an arbitrary
      # package that was built but never actually deployed there. This is enforced
      # structurally, not just a default: workflow_dispatch (the human
      # form above) has no package_id input at all, so `inputs.package_id`
      # is only ever non-empty when this workflow is invoked via
      # workflow_call — i.e. by rollback.yml, the one deliberate exception.
      # resolve_current_package.py has no Boomi-API fallback: if this
      # process was never actually deployed to the environment below, the
      # run fails here rather than guessing. See deployments/README.md.
      - name: Resolve package_id if needed
        id: resolve
        working-directory: scripts
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
        run: |
          if [ -n "${{ inputs.package_id }}" ]; then
            echo "package-id=${{ inputs.package_id }}" >> "$GITHUB_OUTPUT"
            # rollback.yml's explicit package_id has no component-id/version
            # of its own — look them up from our own ledger history (the
            # same self-heal update_deployment_ledger.py does later, just
            # surfaced earlier here so the diff step and issue below have
            # them too, instead of both silently getting blanks).
            python lookup_ledger_metadata.py --package-id "${{ inputs.package_id }}" >> "$GITHUB_OUTPUT"
          else
            source_env="dev"
            if [ "${{ inputs.target_environment }}" = "prod" ]; then source_env="qa"; fi
            python resolve_current_package.py --name "${{ inputs.process_name }}" --environment "$source_env" >> "$GITHUB_OUTPUT"
          fi

      # Best-effort, display-only lookup of what's currently in QA before
      # this promotion.
      - name: Describe current target-environment state
        id: current
        working-directory: scripts
        run: python describe_current.py --name "${{ inputs.process_name }}" --environment "${{ inputs.target_environment || 'qa' }}" >> "$GITHUB_OUTPUT"

      # Structural diff (elements/attributes changed, in plain terms, not
      # raw XML) on top of the version/package-id diff above — see
      # diff_component_versions.py. Non-fatal: degrades to
      # xml-diff-available=false rather than blocking the promotion if it
      # can't produce one for some reason.
      - name: Diff process structure
        id: xmldiff
        continue-on-error: true
        working-directory: scripts
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
        run: |
          python diff_component_versions.py \
            --component-id "${{ steps.resolve.outputs.component-id }}" \
            --from-package-id "${{ steps.current.outputs.current-package-id }}" \
            --to-package-id "${{ steps.resolve.outputs.package-id }}" \
            --out ../component_diff.txt >> "$GITHUB_OUTPUT"

      - name: Upload process diff
        if: steps.xmldiff.outputs.xml-diff-available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: process-diff
          path: component_diff.txt

      - name: Create tracking issue
        id: create_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          target_environment="${{ inputs.target_environment || 'qa' }}"
          diff_line="$target_environment: ${{ steps.current.outputs.current }} -> ${{ steps.resolve.outputs.version }} (package ${{ steps.resolve.outputs.package-id }})"
          if [ "${{ steps.xmldiff.outputs.xml-diff-available }}" = "true" ]; then
            xml_diff_note="See this run's job summary and the process-diff artifact."
          else
            xml_diff_note="Not available for this run (see job summary/logs for why)."
          fi
          issue_title="Promote ${{ inputs.process_name }} to $target_environment"
          issue_body=$(cat <<EOF
          Process: ${{ inputs.process_name }}
          Package: ${{ steps.resolve.outputs.package-id }}
          Version: ${{ steps.resolve.outputs.version }}
          Target: $target_environment
          Deployment: $diff_line
          Process diff: $xml_diff_note

          Requested by: ${{ github.actor }}
          Comment: ${{ inputs.comment }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )
          response=$(curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$(jq -n --arg title "$issue_title" --arg body "$issue_body" --arg env "$target_environment" '{title: $title, body: $body, labels: ["promote", $env]}')" \
            "https://api.github.com/repos/${{ github.repository }}/issues")
          issue_number=$(echo "$response" | jq -r '.number')
          echo "issue-number=$issue_number" >> "$GITHUB_OUTPUT"

          echo "## Promote ${{ inputs.process_name }} to $target_environment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$diff_line" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tracking issue: #$issue_number" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    # The manual workflow targets QA. Calls from rollback.yml retain their
    # requested target, including production's required-reviewer gate.
    environment: ${{ inputs.target_environment == 'prod' && 'production' || inputs.target_environment || 'qa' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create deployment record
        id: create_deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          env_name="${{ inputs.target_environment == 'prod' && 'production' || inputs.target_environment || 'qa' }}"
          response=$(curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$(jq -n --arg ref "${{ github.sha }}" --arg env "$env_name" \
                  --arg desc "Promote ${{ inputs.process_name }} (package ${{ needs.prepare.outputs.package-id }})" \
                  '{ref: $ref, environment: $env, auto_merge: false, required_contexts: [], description: $desc}')" \
            "https://api.github.com/repos/${{ github.repository }}/deployments")
          deployment_id=$(echo "$response" | jq -r '.id')
          echo "deployment-id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Deploy package to target environment
        id: deploy
        working-directory: scripts
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
        run: |
          python deploy_component.py \
            --package-id "${{ needs.prepare.outputs.package-id }}" \
            --env "${{ inputs.target_environment == 'prod' && 'prod' || inputs.target_environment || 'qa' }}" \
            --config "../environments/${{ inputs.target_environment == 'prod' && 'prod' || inputs.target_environment || 'qa' }}.json"

      # Records this promotion into deployments/{ledger,current}.csv and
      # pushes it back to the repo with the run's own GITHUB_TOKEN — GitHub
      # doesn't re-trigger push-triggered workflows for GITHUB_TOKEN
      # commits, so this can't loop (not that cd.yml is push-triggered
      # anyway). See deployments/README.md.
      - name: Record deployment in ledger
        if: steps.deploy.outcome == 'success'
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
        run: |
          env_name="${{ inputs.target_environment == 'prod' && 'prod' || inputs.target_environment || 'qa' }}"
          python scripts/update_deployment_ledger.py \
            --process-name "${{ inputs.process_name }}" \
            --component-id "${{ needs.prepare.outputs.component-id }}" \
            --environment "$env_name" \
            --package-id "${{ needs.prepare.outputs.package-id }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --action promote --status success \
            --requested-by "${{ github.actor }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --comment "${{ inputs.comment }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployments/
          if git diff --cached --quiet; then
            echo "No ledger changes to commit."
          else
            git commit -m "Record promotion: ${{ inputs.process_name }} -> $env_name (${{ needs.prepare.outputs.package-id }})"
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin "${{ github.ref_name }}"
              if git rebase "origin/${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then
                pushed=true
                break
              fi
              sleep $((attempt * 3))
            done
            if [ "$pushed" != true ]; then
              echo "::warning::Failed to push deployment-ledger update after 3 attempts — deployments/*.csv is now out of date until this is reconciled manually."
            fi
          fi

      - name: Finalize deployment status and tracking issue
        if: always() && needs.prepare.outputs.issue-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          outcome="${{ job.status }}"
          state="success"
          if [ "$outcome" != "success" ]; then state="failure"; fi

          if [ -n "${{ steps.create_deployment.outputs.deployment-id }}" ]; then
            curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d "$(jq -n --arg state "$state" '{state: $state, description: ("Run finished with status: " + $state)}')" \
              "https://api.github.com/repos/${{ github.repository }}/deployments/${{ steps.create_deployment.outputs.deployment-id }}/statuses"
          fi

          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$(jq -n --arg body "Run finished with status: $outcome." '{body: $body}')" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ needs.prepare.outputs.issue-number }}/comments"
          curl -s -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"state": "closed"}' \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ needs.prepare.outputs.issue-number }}"

  prepare-production:
    needs: [prepare, deploy]
    if: github.event_name == 'workflow_dispatch' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      issue-number: ${{ steps.create_issue.outputs.issue-number }}
    steps:
      - uses: actions/checkout@v4

      - name: Describe current production state
        id: current
        working-directory: scripts
        run: python describe_current.py --name "${{ inputs.process_name }}" --environment prod >> "$GITHUB_OUTPUT"

      - name: Create production tracking issue
        id: create_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          diff_line="prod: ${{ steps.current.outputs.current }} -> ${{ needs.prepare.outputs.version }} (package ${{ needs.prepare.outputs.package-id }})"
          issue_title="Auto-promote ${{ inputs.process_name }} to production"
          issue_body=$(cat <<EOF
          Automatic production promotion after successful QA deployment.

          Process: ${{ inputs.process_name }}
          Package: ${{ needs.prepare.outputs.package-id }}
          Version: ${{ needs.prepare.outputs.version }}
          Deployment: $diff_line

          Requested by: ${{ github.actor }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )
          response=$(curl -s -X POST \
            -H "Authorization: ******" \
            -H "Accept: application/vnd.github+json" \
            -d "$(jq -n --arg title "$issue_title" --arg body "$issue_body" '{title: $title, body: $body, labels: ["promote", "prod"]}')" \
            "https://api.github.com/repos/${{ github.repository }}/issues")
          issue_number=$(echo "$response" | jq -r '.number')
          echo "issue-number=$issue_number" >> "$GITHUB_OUTPUT"

          echo "## Automatic QA-to-production promotion" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$diff_line" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tracking issue: #$issue_number" >> "$GITHUB_STEP_SUMMARY"
          echo "This job waits on any required reviewers configured for the production Environment." >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    needs: [prepare, prepare-production]
    if: github.event_name == 'workflow_dispatch' && needs.prepare-production.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Sync latest deployment ledger
        run: |
          git fetch origin "${{ github.ref_name }}"
          git show "origin/${{ github.ref_name }}:deployments/ledger.csv" > deployments/ledger.csv
          git show "origin/${{ github.ref_name }}:deployments/current.csv" > deployments/current.csv

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create production deployment record
        id: create_deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          response=$(curl -s -X POST \
            -H "Authorization: ******" \
            -H "Accept: application/vnd.github+json" \
            -d "$(jq -n --arg ref "${{ github.sha }}" \
                  --arg desc "Automatic promote ${{ inputs.process_name }} (package ${{ needs.prepare.outputs.package-id }})" \
                  '{ref: $ref, environment: "production", auto_merge: false, required_contexts: [], description: $desc}')" \
            "https://api.github.com/repos/${{ github.repository }}/deployments")
          deployment_id=$(echo "$response" | jq -r '.id')
          echo "deployment-id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Deploy the same package from QA to production
        id: deploy
        working-directory: scripts
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
        run: |
          python deploy_component.py \
            --package-id "${{ needs.prepare.outputs.package-id }}" \
            --env prod \
            --config "../environments/prod.json"

      - name: Record production deployment in ledger
        if: steps.deploy.outcome == 'success'
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
        run: |
          python scripts/update_deployment_ledger.py \
            --process-name "${{ inputs.process_name }}" \
            --component-id "${{ needs.prepare.outputs.component-id }}" \
            --environment prod \
            --package-id "${{ needs.prepare.outputs.package-id }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --action promote --status success \
            --requested-by "${{ github.actor }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployments/
          if git diff --cached --quiet; then
            echo "No ledger changes to commit."
          else
            git commit -m "Record automatic production promotion: ${{ inputs.process_name }} (${{ needs.prepare.outputs.package-id }})"
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin "${{ github.ref_name }}"
              if git rebase "origin/${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then
                pushed=true
                break
              fi
              sleep $((attempt * 3))
            done
            if [ "$pushed" != true ]; then
              echo "::warning::Failed to push deployment-ledger update after 3 attempts — deployments/*.csv is now out of date until this is reconciled manually."
            fi
          fi

      - name: Finalize production deployment and tracking issue
        if: always() && needs.prepare-production.outputs.issue-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          outcome="${{ job.status }}"
          state="success"
          if [ "$outcome" != "success" ]; then state="failure"; fi

          if [ -n "${{ steps.create_deployment.outputs.deployment-id }}" ]; then
            curl -s -X POST \
              -H "Authorization: ******" \
              -H "Accept: application/vnd.github+json" \
              -d "$(jq -n --arg state "$state" '{state: $state, description: ("Run finished with status: " + $state)}')" \
              "https://api.github.com/repos/${{ github.repository }}/deployments/${{ steps.create_deployment.outputs.deployment-id }}/statuses"
          fi

          curl -s -X POST \
            -H "Authorization: ******" \
            -H "Accept: application/vnd.github+json" \
            -d "$(jq -n --arg body "Run finished with status: $outcome." '{body: $body}')" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ needs.prepare-production.outputs.issue-number }}/comments"
          curl -s -X PATCH \
            -H "Authorization: ******" \
            -H "Accept: application/vnd.github+json" \
            -d '{"state": "closed"}' \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ needs.prepare-production.outputs.issue-number }}"
