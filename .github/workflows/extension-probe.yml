name: Extension Probe

# Read-only. Shows which connections a process (and every process it calls)
# uses, and which of their fields Boomi exposes as environment extensions in the
# chosen environment. Never prints a value — only field names and flags.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to look at"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
      process_name:
        description: "Process name (as shown in Boomi / by 'List Boomi Processes')"
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Probe environment extensions
        working-directory: scripts
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
          PROCESS_NAME: ${{ inputs.process_name }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          python extension_probe.py \
            --process-name "$PROCESS_NAME" \
            --environment "$ENVIRONMENT" \
            --out ../extension_probe.md \
            --raw ../extensions_redacted.json
          cat ../extension_probe.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe report
        uses: actions/upload-artifact@v4
        with:
          name: extension-probe
          path: |
            extension_probe.md
            extensions_redacted.json
