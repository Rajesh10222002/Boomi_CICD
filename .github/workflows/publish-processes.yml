name: Publish Boomi Processes

# Snapshots live Boomi processes (+ latest package per process) to
# docs/processes.json, which the GitHub Pages admin console (docs/index.html)
# reads. Runs on a schedule so the page is "live enough" without the page
# itself ever holding a Boomi credential, plus workflow_dispatch so the
# page's "Refresh now" button (or a person) can force an update on demand.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch live processes from Boomi
        working-directory: scripts
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
        run: python publish_processes.py --out ../docs/processes.json

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/processes.json
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            # [skip ci] matters here: this pushes to main every 15 minutes,
            # and ci.yml triggers on every push to main — without it, every
            # snapshot would kick off a pointless full package/deploy/test run.
            git commit -m "Update processes.json snapshot [skip ci]"
            git push
          fi
