name: Build & Deploy to Dev

# Deliberately workflow_dispatch-only — packaging and deploying to Dev is
# something a developer chooses to do, not something that fires on every
# push/PR. (It used to also trigger on push/pull_request to main; that
# was dropped because components/components.json's pilot process_id is
# still a placeholder, so every one of those automatic runs failed at the
# "Package component(s)" step by design — see CLAUDE.md's "Context you
# don't have yet" for the still-open question of what the real pilot
# process is. Once that's filled in, this can still be run manually
# with process_name/component_id left blank to use components.json.)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for this package, e.g. v1.1 — the version being updated in the Boomi process. Recorded in Boomi's own packageVersion and in this repo's deployment ledger."
        required: true
      process_name:
        description: "Process name (as shown in Boomi / by 'List Boomi Processes')"
        required: false
      component_id:
        description: "Boomi componentId — optional, resolved automatically from process_name if left blank. Leave both blank to package/deploy everything in components.json instead."
        required: false
      comment:
        description: "Optional note about this run (shown in the tracking issue)"
        required: false

concurrency:
  # One run at a time per process_name (or one shared bucket for
  # components.json-driven runs), so two dispatches can't deploy to Dev
  # for the same process concurrently.
  group: ci-${{ github.event.inputs.process_name || 'components-json' }}
  cancel-in-progress: false

permissions:
  contents: write # this job commits the deployment-ledger update
  issues: write
  deployments: write

jobs:
  package-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine process list to package
        id: procs
        working-directory: scripts
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
        run: |
          if [ -n "${{ github.event.inputs.process_name }}" ]; then
            python write_ad_hoc_config.py \
              --name "${{ github.event.inputs.process_name }}" \
              --component-id "${{ github.event.inputs.component_id }}" \
              --out ../ad_hoc_components.json >> "$GITHUB_OUTPUT"
            echo "config=../ad_hoc_components.json" >> "$GITHUB_OUTPUT"
          else
            echo "config=../components/components.json" >> "$GITHUB_OUTPUT"
          fi

      # Runs after the step above so the issue shows the resolved
      # componentId even when only a process_name was given.
      - name: Create tracking issue
        id: create_issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          issue_title="Build & Deploy to Dev — ${{ github.event.inputs.process_name || 'components.json processes' }} (${{ github.event.inputs.version }})"
          issue_body=$(cat <<EOF
          {
          "process_name": "${{ github.event.inputs.process_name }}",
          "component_id": "${{ steps.procs.outputs.resolved-component-id || github.event.inputs.component_id }}",
          "version": "${{ github.event.inputs.version }}",
          "requested_by": "${{ github.actor }}",
          "comment": "${{ github.event.inputs.comment }}",
          "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          )
          response=$(curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$(jq -n --arg title "$issue_title" --arg body "$issue_body" '{title: $title, body: $body, labels: ["build-dev"]}')" \
            "https://api.github.com/repos/${{ github.repository }}/issues")
          issue_number=$(echo "$response" | jq -r '.number')
          echo "issue-number=$issue_number" >> "$GITHUB_OUTPUT"

      - name: Package component(s)
        working-directory: scripts
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
        run: python package_component.py --config ${{ steps.procs.outputs.config }} --version "${{ github.event.inputs.version }}" --out ../packages.json

      - name: Create deployment record
        id: create_deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          response=$(curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$(jq -n --arg ref "${{ github.sha }}" '{ref: $ref, environment: "dev", auto_merge: false, required_contexts: [], description: "CI deploy to Dev"}')" \
            "https://api.github.com/repos/${{ github.repository }}/deployments")
          deployment_id=$(echo "$response" | jq -r '.id')
          echo "deployment-id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Deploy package(s) to Dev
        id: deploy
        working-directory: scripts
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
        run: |
          python deploy_component.py --process-name "${{ github.event.inputs.process_name || 'PLACEHOLDER-sample-process' }}" \
            --packages ../packages.json --env dev --config ../environments/dev.json

      # Records this Dev deploy into deployments/{ledger,current}.csv and
      # pushes it back. See deployments/README.md. Two dispatches for
      # different processes could still race this push (the concurrency
      # group above only serializes the *same* process_name), hence the
      # rebase-and-retry loop.
      - name: Record deployment in ledger
        if: steps.deploy.outcome == 'success'
        run: |
          proc_name="${{ github.event.inputs.process_name || 'PLACEHOLDER-sample-process' }}"
          package_id=$(jq -r --arg name "$proc_name" '.packages[] | select(.name==$name) | .package_id' packages.json)
          component_id=$(jq -r --arg name "$proc_name" '.packages[] | select(.name==$name) | .component_id' packages.json)
          version=$(jq -r --arg name "$proc_name" '.packages[] | select(.name==$name) | .version' packages.json)

          python scripts/update_deployment_ledger.py \
            --process-name "$proc_name" \
            --component-id "$component_id" \
            --environment dev \
            --package-id "$package_id" \
            --version "$version" \
            --action ci-deploy --status success \
            --requested-by "${{ github.actor }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployments/
          if git diff --cached --quiet; then
            echo "No ledger changes to commit."
          else
            git commit -m "Record Dev deployment: $proc_name -> $package_id"
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin "${{ github.ref_name }}"
              if git rebase "origin/${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then
                pushed=true
                break
              fi
              sleep $((attempt * 3))
            done
            if [ "$pushed" != true ]; then
              echo "::warning::Failed to push deployment-ledger update after 3 attempts — deployments/*.csv is now out of date until this is reconciled manually."
            fi
          fi

      - name: Run test cases against Dev
        working-directory: scripts
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
        run: python run_tests.py --env dev --tests ../tests

      - name: Upload packages.json (so cd.yml knows what's deployable)
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages.json

      - name: Finalize deployment status
        if: always() && steps.create_deployment.outputs.deployment-id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state="success"
          if [ "${{ job.status }}" != "success" ]; then state="failure"; fi
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$(jq -n --arg state "$state" '{state: $state, description: ("CI run finished with status: " + $state)}')" \
            "https://api.github.com/repos/${{ github.repository }}/deployments/${{ steps.create_deployment.outputs.deployment-id }}/statuses"

      - name: Close tracking issue
        if: always() && steps.create_issue.outputs.issue-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          outcome="${{ job.status }}"
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$(jq -n --arg body "Run finished with status: $outcome." '{body: $body}')" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.create_issue.outputs.issue-number }}/comments"
          curl -s -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"state": "closed"}' \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.create_issue.outputs.issue-number }}"
