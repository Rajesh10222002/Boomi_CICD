name: CI - Package, Deploy to Dev, Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      process_name:
        description: "Process name (as shown in the Streamlit app / Boomi)"
        required: false
      component_id:
        description: "Boomi componentId to package+deploy+test — set by the Streamlit app, which resolves it live from Boomi. Leave blank to run the push-triggered components.json pipeline instead."
        required: false

jobs:
  package-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine process list to package
        id: procs
        working-directory: scripts
        run: |
          if [ -n "${{ github.event.inputs.component_id }}" ]; then
            python write_ad_hoc_config.py \
              --name "${{ github.event.inputs.process_name }}" \
              --component-id "${{ github.event.inputs.component_id }}" \
              --out ../ad_hoc_components.json
            echo "config=../ad_hoc_components.json" >> "$GITHUB_OUTPUT"
          else
            echo "config=../components/components.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Package component(s)
        working-directory: scripts
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
        run: python package_component.py --config ${{ steps.procs.outputs.config }} --out ../packages.json

      - name: Deploy package(s) to Dev
        working-directory: scripts
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
        run: |
          python deploy_component.py --process-name "${{ github.event.inputs.process_name || 'PLACEHOLDER-sample-process' }}" \
            --packages ../packages.json --env dev --config ../environments/dev.json

      - name: Run test cases against Dev
        working-directory: scripts
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
        run: python run_tests.py --env dev --tests ../tests

      - name: Upload packages.json (so cd.yml / the app know what's deployable)
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages.json
