name: CI - Package, Deploy to Dev, Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      process_name:
        description: "Process name (find it via the 'List Boomi Processes' workflow)"
        required: false
      component_id:
        description: "Boomi componentId to package+deploy+test (from 'List Boomi Processes'). Leave blank to run the push-triggered components.json pipeline instead."
        required: false
      comment:
        description: "Optional note about this run (shown in the tracking issue)"
        required: false

permissions:
  contents: read
  issues: write

jobs:
  package-and-test:
    runs-on: ubuntu-latest
    steps:
      # Manual (workflow_dispatch) runs get a tracking issue as an audit
      # record of who requested what and why — push/pull_request runs don't,
      # to avoid opening an issue on every routine commit.
      - name: Create tracking issue
        id: create_issue
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          issue_title="Build & Deploy to Dev — ${{ github.event.inputs.process_name || 'components.json processes' }}"
          issue_body=$(cat <<EOF
          {
          "process_name": "${{ github.event.inputs.process_name }}",
          "component_id": "${{ github.event.inputs.component_id }}",
          "requested_by": "${{ github.actor }}",
          "comment": "${{ github.event.inputs.comment }}",
          "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          )
          response=$(curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$(jq -n --arg title "$issue_title" --arg body "$issue_body" '{title: $title, body: $body, labels: ["build-dev"]}')" \
            "https://api.github.com/repos/${{ github.repository }}/issues")
          issue_number=$(echo "$response" | jq -r '.number')
          echo "issue-number=$issue_number" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine process list to package
        id: procs
        working-directory: scripts
        run: |
          if [ -n "${{ github.event.inputs.component_id }}" ]; then
            python write_ad_hoc_config.py \
              --name "${{ github.event.inputs.process_name }}" \
              --component-id "${{ github.event.inputs.component_id }}" \
              --out ../ad_hoc_components.json
            echo "config=../ad_hoc_components.json" >> "$GITHUB_OUTPUT"
          else
            echo "config=../components/components.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Package component(s)
        working-directory: scripts
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
        run: python package_component.py --config ${{ steps.procs.outputs.config }} --out ../packages.json

      - name: Deploy package(s) to Dev
        working-directory: scripts
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
        run: |
          python deploy_component.py --process-name "${{ github.event.inputs.process_name || 'PLACEHOLDER-sample-process' }}" \
            --packages ../packages.json --env dev --config ../environments/dev.json

      - name: Run test cases against Dev
        working-directory: scripts
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
        run: python run_tests.py --env dev --tests ../tests

      - name: Upload packages.json (so cd.yml knows what's deployable)
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages.json

      - name: Close tracking issue
        if: always() && github.event_name == 'workflow_dispatch' && steps.create_issue.outputs.issue-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          outcome="${{ job.status }}"
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$(jq -n --arg body "Run finished with status: $outcome." '{body: $body}')" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.create_issue.outputs.issue-number }}/comments"
          curl -s -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"state": "closed"}' \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.create_issue.outputs.issue-number }}"
