name: Debug Boomi Secrets

# One-off sanity check: prints the SHA256 hash of each Boomi repo secret,
# never the value itself. Useful right after adding/updating secrets to
# confirm what actually got saved (catches trailing whitespace, a pasted
# newline, or the wrong value) without ever exposing it in a log.
#
# To verify a secret matches what you meant to paste, hash it yourself
# locally (e.g. `printf '%s' 'the-value' | sha256sum`) and compare.
# A hash of an empty string means that secret isn't set at all.

on:
  workflow_dispatch:

jobs:
  hash-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Hash Boomi secrets
        run: |
          echo "SHA256 of BOOMI_ACCOUNT_ID:"
          echo -n "${{ secrets.BOOMI_ACCOUNT_ID }}" | sha256sum | awk '{print $1}'
          echo "SHA256 of BOOMI_USERNAME:"
          echo -n "${{ secrets.BOOMI_USERNAME }}" | sha256sum | awk '{print $1}'
          echo "SHA256 of BOOMI_API_TOKEN:"
          echo -n "${{ secrets.BOOMI_API_TOKEN }}" | sha256sum | awk '{print $1}'
          echo "SHA256 of BOOMI_BASE_URL (optional -- empty-string hash is expected if unset):"
          echo -n "${{ secrets.BOOMI_BASE_URL }}" | sha256sum | awk '{print $1}'
