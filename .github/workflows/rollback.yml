name: Rollback - Redeploy Previous Package

# Undo a bad promotion by redeploying an older package to qa/prod, as its
# own clearly-labeled Actions entry instead of "re-run cd.yml and remember
# to fill in an old package_id yourself".
#
# Leave package_id blank to auto-pick the package that was actually live
# in target_environment just before the current one, read from this
# repo's deployment ledger (deployments/ledger.csv) with real timestamps.
# There's no fallback if the ledger doesn't have enough history for this
# process+environment yet — that fails loudly (pass an explicit
# package_id instead) rather than guessing from Boomi's global package
# list. When resolved automatically, the job summary always prints the
# candidate table so you can sanity-check the choice.
#
# Delegates to cd.yml (via workflow_call) for the actual deploy, so a
# rollback goes through the exact same tracking issue, deployment record,
# ledger update, and (for prod) required-reviewer approval gate as a
# normal promotion — nothing gets to skip the approval gate just because
# it's a rollback.

on:
  workflow_dispatch:
    inputs:
      process_name:
        description: "Process name (as shown in Boomi / by 'List Boomi Processes')"
        required: true
        type: string
      target_environment:
        description: "Environment to roll back"
        required: true
        type: choice
        options:
          - qa
          - prod
      package_id:
        description: "Explicit packageId to roll back to — leave blank to auto-pick the version live in this environment just before the current one"
        required: false
        type: string
      comment:
        description: "Optional note about why this rollback is happening (shown in the tracking issue)"
        required: false
        type: string

permissions:
  contents: write # must cover cd.yml's needs too (workflow_call permissions are intersected with the caller's)
  issues: write
  deployments: write

jobs:
  resolve_rollback_target:
    runs-on: ubuntu-latest
    outputs:
      package-id: ${{ steps.resolve.outputs.package-id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve rollback package_id if needed
        id: resolve
        working-directory: scripts
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
        run: |
          if [ -n "${{ inputs.package_id }}" ]; then
            echo "package-id=${{ inputs.package_id }}" >> "$GITHUB_OUTPUT"
          else
            python resolve_rollback_package.py --name "${{ inputs.process_name }}" --environment "${{ inputs.target_environment }}" >> "$GITHUB_OUTPUT"
          fi

  promote:
    needs: resolve_rollback_target
    uses: ./.github/workflows/cd.yml
    with:
      process_name: ${{ inputs.process_name }}
      package_id: ${{ needs.resolve_rollback_target.outputs.package-id }}
      target_environment: ${{ inputs.target_environment }}
      comment: "Rollback${{ inputs.comment != '' && format(': {0}', inputs.comment) || '' }}"
    secrets: inherit
