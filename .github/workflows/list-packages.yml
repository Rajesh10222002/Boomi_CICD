name: List Boomi Packages (for rollback)

# One-off lookup: shows every package ever built for a process, not just
# the latest, so an older packageId can be picked as a cd.yml rollback
# target. cd.yml itself has no separate "rollback" button — rolling back
# just means promoting an older package_id instead of the newest one.

on:
  workflow_dispatch:
    inputs:
      process_name:
        description: "Process name (leave blank if using component_id instead)"
        required: false
      component_id:
        description: "Boomi componentId (leave blank if using process_name instead)"
        required: false

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: List packages
        working-directory: scripts
        env:
          BOOMI_ACCOUNT_ID: ${{ secrets.BOOMI_ACCOUNT_ID }}
          BOOMI_USERNAME: ${{ secrets.BOOMI_USERNAME }}
          BOOMI_API_TOKEN: ${{ secrets.BOOMI_API_TOKEN }}
          BOOMI_BASE_URL: ${{ secrets.BOOMI_BASE_URL }}
        run: |
          if [ -n "${{ github.event.inputs.component_id }}" ]; then
            python list_packages.py --component-id "${{ github.event.inputs.component_id }}"
          else
            python list_packages.py --name "${{ github.event.inputs.process_name }}"
          fi
