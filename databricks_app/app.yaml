# Databricks App manifest.
#
# NOTE: I'm not 100% certain this is the exact current schema Databricks
# Apps expects — this product's config format has changed over time and I
# can't test it myself. Treat this as a best-effort starting point: deploy
# it, and whatever error the Databricks CLI/UI gives back tells us exactly
# what to fix. The `valueFrom` names below are resource keys that get bound
# to a real secret-scope/key when the app is created (via the Databricks UI
# or `databricks apps create --resource ...`) — not the secret values
# themselves, so this file is safe to commit as-is.

command: ["streamlit", "run", "app.py"]

env:
  - name: BOOMI_ACCOUNT_ID
    valueFrom: boomi-account-id
  - name: BOOMI_USERNAME
    valueFrom: boomi-username
  - name: BOOMI_API_TOKEN
    valueFrom: boomi-api-token
  - name: GITHUB_API_TOKEN
    valueFrom: github-api-token
  - name: GITHUB_REPO
    value: "Rajesh10222002/Boomi_CICD"
